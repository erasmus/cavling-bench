[project]
name = "danews-edit"
version = "0.1.0"
description = "DaNews-Edit: a benchmark of language models on Danish editorial tasks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "litellm>=1.50",
    "pydantic>=2",
    "typer>=0.12",
    "pyyaml>=6",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "pypdf>=5",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "scipy>=1.13",
    "choix>=0.3",
    "scikit-learn>=1.5",
    "lingua-language-detector>=2.0",
    "rapidfuzz>=3.9",
    "tenacity>=8.3",
    "rich>=13",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[project.scripts]
danews = "danews.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/danews"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
per-file-ignores = { "src/danews/agreement.py" = ["E501"], "src/danews/report.py" = ["E501"] }
select = ["E", "F", "I", "UP", "B"]
