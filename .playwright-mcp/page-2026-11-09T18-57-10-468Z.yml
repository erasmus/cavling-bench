                - text: ". Deltagere i statsrevisormødet: Mette Abildgaard (KF), Leif Lahn Jensen (S), Mikkel Irminger Sarbo (RV), Lars Christian Lilleholt (V), Peter Westermann (SF) og Mohammad Rona (M)"
