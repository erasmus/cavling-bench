              - generic [ref=f20e116]: 09.11.2026
              - heading [level=2] [ref=f20e117]:
                - link "Statsrevisorerne finder forvaltningen af filmstøtten utilstrækkelig" [ref=f20e118] [cursor=pointer]:
                  - /url: https://www.ft.dk/da/statsrevisorerne/nyheder/2026/11/statsrevisorerne-finder-forvaltningen-af-filmstoetten-utilstraekkelig
              - paragraph [ref=f20e119]: Filminstituttet har ikke i tilstrækkelig grad understøttet, at filmkonsulenterne er økonomisk uafhængige af filmbranchen, og Kulturministeriet har ikke etableret et tilstrækkeligt administrationsgrundlag og opfølgning på Filminstituttets mål. Det viser en ny beretning fra Rigsrevisionen.
              - generic [ref=f20e120]: 09.11.2026
              - heading [level=2] [ref=f20e121]:
                - link "Statsrevisorerne kritiserer Forsvarsministeriets tilsyn med det særligt væsentlige materiel" [ref=f20e122] [cursor=pointer]:
                  - /url: https://www.ft.dk/da/statsrevisorerne/nyheder/2026/11/statsrevisorerne-kritiserer-forsvarsministeriets-tilsyn-med-det-saerligt-vaesentlige-materiel
              - paragraph [ref=f20e123]: Der var sidste år problemer med mere end halvdelen af de typer af materiel, som Forsvarsministeriet vurderer til at være særligt væsentlige, for at de kan løse deres opgaver. Ministeriet har ikke et tilstrækkeligt overblik over materiellet.
              - generic [ref=f20e124]: 05.10.2026
              - heading [level=2] [ref=f20e125]:
                - link "Stephanie Lose er ny formand for Statsrevisorerne" [ref=f20e126] [cursor=pointer]:
                  - /url: https://www.ft.dk/da/statsrevisorerne/nyheder/2026/10/stephanie-lose-er-ny-formand-for-statsrevisorerne
              - paragraph [ref=f20e127]: Statsrevisorerne har valgt Venstres Stephanie Lose som formand. Socialdemokratiets Leif Lahn Jensen fortsætter som næstformand.
              - generic [ref=f20e128]: 05.10.2026
              - heading [level=2] [ref=f20e129]:
                - link "Regionernes ventetider på demensudredning får skarp kritik fra Statsrevisorerne" [ref=f20e130] [cursor=pointer]:
                  - /url: https://www.ft.dk/da/statsrevisorerne/nyheder/2026/10/regionernes-ventetider-paa-demensudredning-faar-skarp-kritik-fra-statsrevisorerne
              - paragraph [ref=f20e131]: Den gennemsnitlige ventetid på at blive udredt for demens var sidste år mere end fem gange længere end de 30 dage, som loven siger. Proble-merne er taget til gennem de seneste fire år.
              - generic [ref=f20e132]: 05.10.2026
              - heading [level=2] [ref=f20e133]:
                - 'link "Statsrevisorerne: DSB’s styring af købet af nye IC5-tog er meget utilfredsstillende" [ref=f20e134] [cursor=pointer]':
                  - /url: https://www.ft.dk/da/statsrevisorerne/nyheder/2026/10/statsrevisorerne-dsbs-styring-af-koebet-af-nye-ic5-tog-er-meget-utilfredsstillende
              - paragraph [ref=f20e135]: De nye, eldrevne IC5-tog bliver mindst 3 år forsinket. Det øger risikoen for nedbrud og ustabil drift og medfører en ekstraregning på i alt 3,5 mia. kr.
              - generic [ref=f20e136]: 07.09.2026
              - heading [level=2] [ref=f20e137]:
                - link "Stærkt foruroligende pesticidkontrol udløser skarp kritik fra Statsrevisorerne" [ref=f20e138] [cursor=pointer]:
                  - /url: https://www.ft.dk/da/statsrevisorerne/nyheder/2026/09/staerkt-foruroligende-pesticidkontrol-udloeser-skarp-kritik-fra-statsrevisorerne
              - paragraph [ref=f20e139]: Miljøstyrelsens kontrol med brug af pesticider har en række alvorlige mangler. Derfor udtaler Statsrevisorerne i dag skarp kritik af Miljøministeriet.
              - generic [ref=f20e140]: 07.09.2026
              - heading [level=2] [ref=f20e141]:
                - link "Statsrevisorerne udtaler skarp kritik af tilsynet med havbrug i Danmark" [ref=f20e142] [cursor=pointer]:
                  - /url: https://www.ft.dk/da/statsrevisorerne/nyheder/2026/09/statsrevisorerne-udtaler-skarp-kritik-af-tilsynet-med-havbrug-i-danmark
              - paragraph [ref=f20e143]: Miljøministeriets tilsyn med danske havbrug samt forvaltningen af tilladelser til at drive havbrug får skarp kritik af Statsrevisorerne.
              - generic [ref=f20e144]: 17.08.2026
              - heading [level=2] [ref=f20e145]:
                - 'link "Statsrevisorerne: Statens regnskab for 2025 er rigtigt med et enkelt forbehold" [ref=f20e146] [cursor=pointer]':
                  - /url: https://www.ft.dk/da/statsrevisorerne/nyheder/2026/08/statsrevisorerne-statens-regnskab-for-2025-er-rigtigt-med-et-enkelt-forbehold
              - paragraph [ref=f20e147]: Revisionen viser, at statsregnskabet for 2025 er rigtigt. Rigsrevisionen tager dog et forbehold på Miljøministeriets regnskab. Gennemgangen af statens forvaltning har fundet problemer i 16 af 57 revisioner, mens alle 43 virksomheder uden for statsregnskabet har fået påtegning uden forbehold.
              - generic [ref=f20e148]: 12.08.2026
              - heading [level=2] [ref=f20e149]:
                - link "Folketinget udpeger nye statsrevisorer for 2026-2030" [ref=f20e150] [cursor=pointer]:
                  - /url: https://www.ft.dk/da/statsrevisorerne/nyheder/2026/08/folketinget-udpeger-nye-statsrevisorer-for-2026-2030
              - paragraph [ref=f20e151]: Der er den 12. august blevet sat navn på de seks statsrevisorer for perioden 2026-2030. Det nye kollegium tiltræder 1. oktober.
              - generic [ref=f20e152]: 15.06.2026
              - heading [level=2] [ref=f20e153]:
                - link "Moderaterne udpeger Mohammad Rona som statsrevisor" [ref=f20e154] [cursor=pointer]:
                  - /url: https://www.ft.dk/da/statsrevisorerne/nyheder/2026/06/moderaterne-udpeger-mohammad-rona-som-statsrevisor
              - paragraph [ref=f20e155]: Moderaternes Mohammad Rona afløser Monika Rubin som statsrevisor, efter Monika Rubin blev udnævnt om minister.
              - generic [ref=f20e156]: 08.06.2026
              - heading [level=2] [ref=f20e157]:
                - 'link "Statsrevisorerne: Forsvarsministeriets manglende overblik over udgifter til F-35-kampflyene er utilfredsstillende" [ref=f20e158] [cursor=pointer]':
                  - /url: https://www.ft.dk/da/statsrevisorerne/nyheder/2026/06/forsvarsministeriets-manglende-overblik-over-udgifter-til-f-35-kampflyene-er-utilfredsstillende
              - paragraph [ref=f20e159]: Statsrevisorerne finder det utilfredsstillende, at Forsvarsministeriet ikke har haft et overblik over de samlede udgifter til indkøb af 27 F-35-kampfly. Det er meget utilfredsstillende, at Folketinget ikke har været fyldestgørende orienteret om de forventede udgifter til købet, lyder kritikken bl.a.
              - generic [ref=f20e160]: 08.06.2026
              - heading [level=2] [ref=f20e161]:
                - link "Statsrevisorerne finder manglende opfølgning på krav til undervisning i folkeskolen meget utilfredsstillende" [ref=f20e162] [cursor=pointer]:
                  - /url: https://www.ft.dk/da/statsrevisorerne/nyheder/2026/06/finder-manglende-opfoelgning-paa-krav-til-undervisning-i-folkeskolen-meget-utilfredsstillende
              - paragraph [ref=f20e163]: Mange elever i folkeskolen får ikke den undervisning i dansk og matematik, som de har krav på ifølge loven. Undervisningsministeriet har ikke fulgt op på, om kravene faktisk blev opfyldt.
              - generic [ref=f20e164]: 11.05.2026
              - heading [level=2] [ref=f20e165]:
                - link "Statsrevisorerne finder politiets praksis for henlæggelser af sager om personfarlig kriminalitet stærkt foruroligende" [ref=f20e166] [cursor=pointer]:
                  - /url: https://www.ft.dk/da/statsrevisorerne/nyheder/2026/05/statsrevisorerne-finder-politiets-henlaeggelser-af-personfarlig-kriminalitet-staerkt-foruroligende
              - paragraph [ref=f20e167]: En ny beretning fra Rigsrevisionen tegner et billede af problematisk behandling af sager om personfarlig kriminalitet. Det udløser kritik på næsthøjeste niveau fra Statsrevisorerne.
