            - generic [ref=f28e106]:
              - heading "Presse" [level=1] [ref=f28e107]
              - paragraph [ref=f28e108]: Læs om adgangsforhold og kriterier for pressen på Christiansborg slot. Find Folketingets pressekontakt, download pressefoto eller læs om brug af Folketingets logo.
            - generic [ref=f28e109]: 
            - generic [ref=f28e118]:
              - paragraph [ref=f28e119]: Med et pressekort eller et id-kort fra de store tv-stationer, kan du få adgang til Folketinget. Der kræves ikke anden særlig akkreditering til Folketinget.
              - heading "Pressekort giver adgang til Folketinget" [level=2] [ref=f28e120]
              - generic [ref=f28e121]:
                - paragraph [ref=f28e122]: Offentligheden skal have de bedste betingelser for at kunne følge det politiske arbejde. Det kan ske dels ved selv at besøge Folketinget og dels gennem mediernes dækning. Som journalist eller fotograf har du derfor mulighed for at få adgang til Folketinget med dit pressekort. Pressekortet skal være et gyldigt dansk eller et internationalt udstedt pressekort.
                - paragraph [ref=f28e123]: Pressen har adgang til Presselogen, hvor mødet i salen kan følges på nærmeste hold. Som journalist eller fotograf har du også mulighed for at overvære åbne samråd, konferencer og andre parlamentariske arrangementer i Folketinget. Det kræver forhåndstilmelding at overvære et åbent samråd. Reglerne er de samme for journalister med privilegeret adgang. Kontakt altid arrangøren.
                - heading "Særlige lejligheder" [level=2] [ref=f28e124]
                - text: Ved særlige lejligheder, som på en valgaften eller i forbindelse med Folketingets åbning, kan der være særlige forhold, der gør sig gældende. Hvis der er krav om særlig akkreditering, vil du kunne læse om det på Folketingets hjemmeside.
            - generic [ref=f28e129]:
              - heading "Mere information" [level=2] [ref=f28e130]
              - paragraph [ref=f28e131]: Du kan læse mere i folderen »Regler for journalistisk arbejde, fotografering og tv-optagelser i Folketinget«.
              - paragraph [ref=f28e132]: Hvis du har spørgsmål til pressens adgang til Folketinget, kan du kontakte Folketingets Servicecenter på 3337 5500.
