                - listitem [ref=f24e84]:
                  - text: ›
                  - link "Regionernes ventetider paa demensudredning faar skarp kritik fra Statsrevisorerne" [ref=f24e85]:
                    - /url: https://www.ft.dk/da/statsrevisorerne/nyheder/2026/10/regionernes-ventetider-paa-demensudredning-faar-skarp-kritik-fra-statsrevisorerne
            - heading "Regionernes ventetider på demensudredning får skarp kritik fra Statsrevisorerne" [level=1] [ref=f24e86]
            - paragraph [ref=f24e88]: 05.10.2026
            - paragraph [ref=f24e89]: Den gennemsnitlige ventetid på at blive udredt for demens var sidste år mere end fem gange længere end de 30 dage, som loven siger. Proble-merne er taget til gennem de seneste fire år.
            - generic [ref=f24e90]:
              - paragraph [ref=f24e91]: "Næsten 25.000 demensramte har de seneste 4 år oplevet at vente længere end 30 dage på at blive udredt for deres sygdom. Det svarer til fem ud af seks, der er henvist til udredning på sygehuset. Derfor har Statsrevisorerne i dag udtalt skarp kritik af regionerne, som har ansvaret for udredningen. Rigsrevisionens beretning viser, at der er store forskelle på, hvor gode regionerne er til at overholde tidsfristen. Men der er ingen regioner, som kommer tæt på at opfylde lovens krav. Der er også problemer med selve udredningen. Der er fx stor forskel mellem regionerne på, om patienterne faktisk får de undersøgelser, de har brug for. Og der ses en væsentlig forskel i behandlingens kvalitet, alt efter hvilken social baggrund patienterne kommer med. Statsrevisorerne udtaler: ”Beretningen viser, at vi er meget langt fra målet om, at patienter skal udredes for demens inden for 30 dage, og at ventetiden vokser. Der er alt for store forskelle mellem vores regioner og mellem borgere med stærk og svag social baggrund, når det kommer til kvaliteten af den specialiserede udredning og adgangen til nødvendige undersøgelser. Det kritiserer vi skarpt.”"
              - paragraph [ref=f24e92]:
                - strong [ref=f24e93]: "Statsrevisorerne har hæftet sig ved disse undersøgelsesresultater:"
              - list [ref=f24e94]:
                - listitem [ref=f24e95]: Over halvdelen af den tid, hvor patienterne venter på at blive udredt, går med at vente på det første møde på sygehuset.
                - listitem [ref=f24e96]: Kvaliteten af ministeriets data om, hvornår patienterne er færdigudredte, er ikke retvisende, fordi flere udredningsenheder registrerer patienter som færdigudredt ved patientens første møde på sygehuset. Der er også patienter, som bliver registreret som færdigudredt, selv om udredningen fortsætter.
                - listitem [ref=f24e97]: Sundhedsstyrelsen anbefaler, at regionerne har større udredningsenheder. 23 af regionens 33 udredningsenheder udredte under 500 patienter i 2025. En stor del af enhederne lever dermed ikke op til Sundhedsstyrelsens anbefaling. Patienter, som bliver udredt på store udredningsenheder, får oftere de specialiserede undersøgelser, som de er i målgruppen for.
                - listitem [ref=f24e98]: Sundhedsstyrelsen forventer, at ca. 18 % af de patienter, som i dag bliver udredt på sygehuset, fremover kan blive udredt hos deres egen læge. Mere udredning hos de praktiserende læger vil alt andet lige medføre et højere mørketal, medmindre ministeriet pålægger lægerne at registrere udredningen i nationale databaser.
                - listitem [ref=f24e99]: Kvaliteten af regionernes basale udredning er ensartet, og næsten alle patienter får den basale udredning, som de er målgruppen for.
                - listitem [ref=f24e100]: Der er forskel på kvaliteten af den specialiserede udredning på tværs af regionerne. På landsplan får knap 1/3 af patienterne ikke de specialiserede undersøgelser, som de er i målgruppen for.
                - listitem [ref=f24e101]: For 4 ud af 5 regioner er der udviklingsmål for den specialiserede udredning, som ikke nås. Målene for udredningen er dog ikke retligt bindende.
                - listitem [ref=f24e102]: En gennemsnitlig patients udredningstid falder med 24 dage, hvis patientens sociale baggrund er stærk frem for svag. Dertil kommer, at 79% af patienterne med stærk social baggrund får adgang til specialiseret udredning, mens det kun gør sig gældende for 64% af patienterne med svag social baggrund.
              - paragraph [ref=f24e103]: Statsrevisorerne er enige i Rigsrevisionens anbefaling om, at årsagerne til forskelle i kvaliteten af udredningen og forskellene i udredningens ventetid og kvalitet for patienter afhængigt af deres sociale baggrund bør undersøges.
              - paragraph [ref=f24e104]:
                - text: Se hele beretningen og kort fortalt –
                - link "her" [ref=f24e105] [cursor=pointer]:
                  - /url: https://www.ft.dk/statsrevisor/20261/beretning/sb2/index.htm
                - text: ". Deltagere i statsrevisormødet: Stephanie Lose (V), Leif Lahn Jensen (S), Peter Westermann (SF), Benny Engelbrecht (S), Anders Vistisen (DF) og Steffen Larsen (LA) Stephanie Lose og Peter Westermann har erklæret sig inhabil i sagen."
