# Pinned 2026-11-09. Prices are USD list per 1M tokens on that date (see DECISIONS.md).
# EU residency: "yes" = vendor documents EU processing by default; "cloud region" = via
# regional endpoint; "no" = not documented; "self-hosted" = local.
judges:
  A: nebius-gpt-oss-120b
  B: anthropic-mid
judge_b_sample_fraction: 0.25

models:
  - id: anthropic-frontier
    display: "Claude Fable 5.1"
    family: anthropic
    tier: frontier_proprietary
    litellm_model: anthropic/claude-fable-5-1
    pinned_version: claude-fable-5-1
    billing: paid
    api_key_env: ANTHROPIC_API_KEY
    price_in_per_m: 10.00
    price_out_per_m: 50.00
    open_weights: false
    licence: proprietary
    eu_residency: "no"
    supports_seed: false
    supports_temperature: false
    reasoning_effort: low
    reasoning_budget_tokens: 3000
    notes: "Anthropic API 2026-10-21 removed temperature/top_p/top_k; inference_geo only global/us."

  - id: anthropic-mid
    display: "Claude Sonnet 5.5"
