                  - link "Statsrevisorerne udtaler skarp kritik af tilsynet med havbrug i Danmark" [ref=f16e85]:
                    - /url: https://www.ft.dk/da/statsrevisorerne/nyheder/2026/09/statsrevisorerne-udtaler-skarp-kritik-af-tilsynet-med-havbrug-i-danmark
            - heading "Statsrevisorerne udtaler skarp kritik af tilsynet med havbrug i Danmark" [level=1] [ref=f16e86]
            - paragraph [ref=f16e88]: 07.09.2026
            - paragraph [ref=f16e89]: Miljøministeriets tilsyn med danske havbrug samt forvaltningen af tilladelser til at drive havbrug får skarp kritik af Statsrevisorerne.
            - generic [ref=f16e90]:
              - text: "Ingen af de 19 havbrug, der findes i Danmark, har fået de nødvendige tilladelser fra Miljøstyrelsen. Det betyder, at de er underlagt forældede miljøkrav, hvilket medfører forurening, som skader det omkringliggende hav. Det konkluderer Rigsrevisionen i en ny beretning, som udløser skarp kritik fra Statsrevisorerne. Beretningen viser, at Miljøstyrelsens forvaltning i flere tilfælde har forsinket udstedelsen af tilladelser, og at tilladelserne stadig ikke er på plads. Sagsbehandling af nye tilladelser har indtil videre strakt sig over 11 år. Det skyldes bl.a., at kvaliteten af sagsbehandlingen har været for dårlig, som afgørelser er blevet underkendt. Når havbrugsvirksomhederne har overtrådt de miljøregler, de er underlagt, har styrelsen i mange tilfælde ikke håndhævet og sanktioneret overtrædelsen. Statsrevisorerne udtaler: ”Samtlige 19 havbrug i Danmark mangler de nødvendige tilladelser og har gjort det i årevis. Den lange ventetid skyldes Miljøministeriets sagsbehandling. Tilsynet med havbrugene er også helt utilstrækkeligt, bl.a. fordi styrelsen ikke konsekvent har håndhævet gentagne overtrædelser. Det medfører skader på havmiljøet. Derfor udtaler vi i dag en skarp kritik.”"
              - paragraph [ref=f16e91]:
                - strong [ref=f16e92]: "Statsrevisorerne har hæftet sig ved disse undersøgelsesresultater:"
              - list [ref=f16e93]:
                - listitem [ref=f16e94]: Miljøstyrelsen har ikke sikret, at der er udarbejdet fyldestgørende habitat-vurderinger, selv om det er en forudsætning for at få en placeringstilladelse og en miljøgodkendelse til at drive et havbrug
                - listitem [ref=f16e95]: Ingen af havbrugene har både en placeringstilladelse og en miljøgodkendelse, hvilket de skal have for at kunne drive et havbrug efter gældende regler.
                - listitem [ref=f16e96]: 17 af de 19 havbrug mangler en miljøgodkendelse. 10 havbrug har på forskellige tidspunkter i perioden 2014-2022 haft en miljøgodkendelse, men alle godkendelserne blev underkendt af Miljø- og Fødevareklagenævnet, fordi habitatscreeningerne og habitatvurderingerne ikke havde den fornødne kvalitet. Indtil miljøgodkendelserne er på plads, skal Miljøstyrelsen administrere de 17 havbrug efter de vilkår, som er fastsat i havbrugstilladelserne tilbage fra 1990’erne, hvor der var mindre restriktive krav til havbrugenes forurening, fx i forhold til kobber og organisk stof.
                - listitem [ref=f16e97]: Den gennemsnitlige sagsbehandlingstid er indtil videre 7 år for en placeringstilladelse og 11 år for en miljøgodkendelse. Miljøstyrelsen vurderer, at det reelt tager mellem 1½ år og 2 år at behandle en placeringstilladelse og/eller en miljøgodkendelse.
                - listitem [ref=f16e98]: Miljøstyrelsen har udført de lovpligtige fysiske tilsyn, men har ikke reageret på, at der er store mangler i de oplysninger, som havbrugene er forpligtede til at indsende om produktion og miljøpåvirkning.
                - listitem [ref=f16e99]: Miljøstyrelsen har ifølge loven pligt til at følge havbrugenes brug af forurenende stoffer, men har ikke gjort det i tilstrækkeligt omfang.
                - listitem [ref=f16e100]: Miljøstyrelsen har ikke tilstrækkeligt indblik i den mulige ophobning af stoffer fra havbrugene i havmiljøet. Det gælder fx antibiotika, som kan lede til resistente havbakterier til fare for menneskers sundhed, og kobber, som kan slå fisk ihjel.
                - listitem [ref=f16e101]:
                  - text: De 19 havbrug har i 342 tilfælde overtrådt vilkår i tilladelserne eller i loven i perioden 2018-2025. I mere end halvdelen af tilfældene er der tale om gentagelse af samme type overtrædelse. Heraf har styrelsen håndhævet 30 overtrædelser og har i alle 30 tilfælde valgt at give en indskærpelse.
                  - strong
              - paragraph [ref=f16e102]:
                - text: Se hele beretningen og kort fortalt –
                - link "her" [ref=f16e103] [cursor=pointer]:
