name: rerun
on:
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated model ids (default: all API models; local models are skipped in CI)"
        default: ""
      stages:
        description: "Comma-separated stages from generate,check,judge,report"
        default: "generate,check,judge,report"
jobs:
  rerun:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Notice about local models
        run: echo "::notice::Local models (dfm-*, syvai-*) are skipped in CI because LOCAL_VLLM_BASE_URL is unset."
      - name: Run stages
        run: |
          IFS=',' read -ra STAGES <<< "${{ inputs.stages }}"
          MODELS_FLAG=""
          if [ -n "${{ inputs.models }}" ]; then MODELS_FLAG="--models ${{ inputs.models }}"; fi
          for s in "${STAGES[@]}"; do
            case "$s" in
              generate) uv run danews generate $MODELS_FLAG ;;
              check) uv run danews check ;;
              judge) uv run danews judge grounding && uv run danews judge tone && uv run danews judge fluency ;;
              report) uv run danews report && uv run danews site ;;
            esac
          done
          uv run danews costs
      - name: Open PR with results
        uses: peter-evans/create-pull-request@v7
        with:
          branch: rerun/${{ github.run_id }}
          title: "rerun: ${{ inputs.stages }} (${{ inputs.models || 'all models' }})"
          commit-message: "data: rerun ${{ inputs.stages }}"
          body: "Automated rerun via workflow_dispatch. Review costs.jsonl and results/ before merging."
          add-paths: |
            outputs/
            scores/
            results/
            site/
            costs.jsonl
